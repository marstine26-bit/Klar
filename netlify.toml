[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(self)"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://static.cloudflareinsights.com https://cdnjs.cloudflare.com https://client.crisp.chat https://eu.i.posthog.com https://eu-assets.i.posthog.com; connect-src 'self' https://*.supabase.co https://api.groq.com https://eu.i.posthog.com https://*.crisp.chat wss://*.crisp.chat https://api.saltedge.com https://api.frankfurter.app https://api.frankfurter.dev https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://client.crisp.chat; font-src 'self' https://fonts.gstatic.com https://client.crisp.chat; img-src 'self' data: https:; frame-src https://*.crisp.chat; frame-ancestors 'none'"

# Always revalidate HTML files, but allow conditional GETs (304s) instead of forcing a full
# re-download every load — no-store previously blocked even ETag-based revalidation, which
# needlessly burned bandwidth-metered Netlify credits on every repeat visit of the 1.2MB app file.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

# Cache static assets aggressively
[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# .md files (investor docs, competitive brief, pitch materials) were served with no
# charset, so browsers guessed a non-UTF-8 encoding and double-decoded multi-byte
# characters (em dashes, £) into garbage (e.g. "â€”"). Files themselves are correctly
# UTF-8 -- this was purely a missing header at serve time.
[[headers]]
  for = "/*.md"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"

# Landing page and app are served natively as index.html at their own paths
# (/ -> index.html, /app -> app/index.html) -- no redirect rules needed.
# Previously rewrote to klarmoney-landing.html / "Klar Rebrand.html" here;
# removed when those files were renamed to the standard index.html
# convention (see also _redirects, which had the equivalent Cloudflare rules
# and the same reasoning for why they were removed there).

# Icon assets — copy klar-assets/png files into an /icons/ folder at deploy root
# Required files: klar-128.png, klar-180.png, klar-256.png, klar-512.png
# Source: ClearLedger/klar-assets/png/klar-mark-primary-{128,256,512}.png
# (rename to klar-128.png, klar-256.png, klar-512.png; generate klar-180.png at 180×180)

[build]
  publish = "."
