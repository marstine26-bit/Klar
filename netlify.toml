[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(self)"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://assets.lemonsqueezy.com https://cdn.jsdelivr.net https://static.cloudflareinsights.com https://cdnjs.cloudflare.com; connect-src 'self' https://*.supabase.co https://api.groq.com https://*.lemonsqueezy.com https://app.posthog.com https://*.crisp.chat https://api.saltedge.com https://api.frankfurter.app https://api.frankfurter.dev; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; frame-src https://*.lemonsqueezy.com; frame-ancestors 'none'"

# Always revalidate HTML files, but allow conditional GETs (304s) instead of forcing a full
# re-download every load — no-store previously blocked even ETag-based revalidation, which
# needlessly burned bandwidth-metered Netlify credits on every repeat visit of the 1.2MB app file.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

# Cache static assets aggressively
[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# Redirect bare domain to www (optional — remove if not using www)
# [[redirects]]
#   from = "https://klarmoney.netlify.app/*"
#   to = "https://www.klarmoney.app/:splat"
#   status = 301
#   force = true

# Landing page at root — app accessible at /app
[[redirects]]
  from = "/"
  to = "/klarmoney-landing.html"
  status = 200
  force = true

[[redirects]]
  from = "/app"
  to = "/Klar Rebrand.html"
  status = 200
  force = true

# Icon assets — copy klar-assets/png files into an /icons/ folder at deploy root
# Required files: klar-128.png, klar-180.png, klar-256.png, klar-512.png
# Source: ClearLedger/klar-assets/png/klar-mark-primary-{128,256,512}.png
# (rename to klar-128.png, klar-256.png, klar-512.png; generate klar-180.png at 180×180)

[build]
  publish = "."
